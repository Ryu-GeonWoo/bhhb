name: Deploy to GitHub Pages via angular-cli-ghpages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Prepare and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run ng -- deploy --base-href=/bhhb/ --name="Ryu-GeonWoo" --email="Ryu-GeonWoo@users.noreply.github.com" --no-silent
